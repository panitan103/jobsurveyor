services:
  app:
    build: .
    container_name: jobsurveyor
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      DATA_DIR: /data
      DEFAULT_LANG: th
      TZ: Asia/Bangkok
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/api/jobs"]
      interval: 30s
      timeout: 5s
      retries: 3
